[tool.poetry]
name = "property-discovery-platform"
version = "0.4.0"
description = "AI-powered Property Discovery Platform — Phase 4: Free Chat NL2SQL Agent"
authors = []
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python          = "^3.12"
sqlalchemy      = { version = "^2.0", extras = ["asyncio"] }
asyncpg         = "^0.29"
pydantic        = "^2.0"
pydantic-settings = "^2.0"
fastapi         = "^0.115"
uvicorn         = { version = "^0.30", extras = ["standard"] }
# Phase 4 additions
langgraph       = "^0.3"
langchain-core  = "^0.3"
openai          = "^1.0"
anthropic       = "^0.40"
sqlparse        = "^0.5"

[tool.poetry.group.dev.dependencies]
pytest          = "^8.0"
pytest-asyncio  = "^0.23"
pytest-cov      = "^5.0"
httpx           = "^0.27"

[build-system]
requires      = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode                      = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths                         = ["app/tests"]
pythonpath                        = ["."]
markers                           = ["llm: marks tests that require a running LLM (deselect with -m 'not llm')"]

[tool.ruff]
line-length = 100
target-version = "py312"
